# pnpm settings. As of pnpm 11 this file, not package.json or .npmrc, is where
# pnpm-specific configuration lives. See https://pnpm.io/settings.

# Save dependency versions exactly; upgrades are handled by Dependabot.
savePrefix: ""

# Dependencies allowed to run install lifecycle scripts. Everything else is
# blocked by default; run `pnpm approve-builds` to review new requests.
allowBuilds:
  # Unpacks the bundled web, CLI, and TUI clients that `pnpm run inspect` runs.
  "@modelcontextprotocol/inspector": true
  # Pulled in by the inspector. Ships prebuilt platform bindings, so the
  # build-from-source fallback never has to run.
  "@parcel/watcher": false
  # Selects the prebuilt native binding for the current platform.
  unrs-resolver: true

# Security floors for transitive dependencies. Each is capped to the major
# its dependent actually declares, so an override never drags in a major
# that the dependent has not claimed to support. Drop each one once the
# dependent requires a patched version on its own.
overrides:
  # glob 10 -> minimatch 9 -> brace-expansion 2.1.4. Denial of service via
  # stack exhaustion on nested brace groups and in comma parsing, and via
  # quadratic-time expansion. Fixed across 2.1.5 to 2.1.7; minimatch 9 asks
  # for ^2.0.2. Scoped to 2.x because minimatch 10 uses brace-expansion 5.
  brace-expansion@2: "^2.1.7"
  # ajv -> fast-uri 3.1.5. Host confusion via percent-encoded scheme
  # normalization and via skipped IDN canonicalization, plus SSRF via
  # malformed IPv6 normalization and via repeated hostname percent-decoding.
  # Fixed in 3.1.6. 3.1.8 then had scheme injection and spoofing, host
  # confusion via WHATWG canonicalization, and improper path equivalence,
  # all fixed in 3.1.9. ajv asks for ^3.0.1.
  fast-uri: "^3.1.9"
  # jest -> @istanbuljs/load-nyc-config -> js-yaml 3.15.1. Denial of service
  # via merge keys with empty sources. Fixed in 3.15.2; load-nyc-config asks
  # for ^3.13.1.
  js-yaml: "^3.15.2"
  # postcss -> nanoid 3.3.17. A custom generator loops indefinitely when the
  # requested size is zero. Fixed in 3.3.18; postcss asks for ^3.3.17.
  nanoid: "^3.3.18"
  # express -> qs 6.15.3. Array-limit bypass via bracket-key comma parsing,
  # and denial of service via an attacker-controlled isBuffer. Both fixed in
  # 6.16.0. 6.16.0 then had a denial of service in stringify with arrayFormat
  # "comma", fixed in 6.16.1. express asks for ^6.16.0.
  qs: "^6.16.1"
