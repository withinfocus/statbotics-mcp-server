# zizmor configuration. See https://docs.zizmor.sh/configuration/.

rules:
  # Every action is pinned to a full commit hash, with its version in a
  # trailing comment that Dependabot keeps in step. Require a hash pin for all
  # of them, including the actions/* and github/* ones zizmor would otherwise
  # accept by tag.
  unpinned-uses:
    config:
      policies:
        "*": hash-pin

  # The build job caches pnpm downloads and also pushes the image. Poisoning
  # that cache means writing to it first, which needs push access to this
  # repository, and the job itself only runs on pushes to main. Low confidence.
  cache-poisoning:
    ignore:
      - ci.yml
